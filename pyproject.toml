# ── Build system ──────────────────────────────────────────────────────────────
# Setuptools handles the Python src-layout package.
# The voxel simulation is pure Python + numpy + GLSL — no C++ build needed.
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# ── Project metadata ──────────────────────────────────────────────────────────
[project]
name = "cnc-controller"
version = "0.1.0"
description = "Custom LinuxCNC Control Software"
requires-python = ">=3.11"

dependencies = [
    "pyside6>=6.7.0",
    "moderngl>=5.10.0",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
# Optional JIT kernels for the tri-dexel simulation (sim/dexel/_kernels.py);
# without numba the bit-identical numpy paths are used.
fast = [
    "numba>=0.68.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-qt>=4.4.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "pre-commit>=3.8.0",
]

[project.scripts]
datum-control = "controller.main:main"

# ── setuptools: src-layout ────────────────────────────────────────────────────
[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = [
    "ui/resources/**/*",
    "sim/assets/**/*",
]

# ── Linting / typing ──────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
